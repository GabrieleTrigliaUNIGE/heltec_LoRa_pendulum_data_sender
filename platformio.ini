; PlatformIO project: Heltec WiFi LoRa 32 V4 (ESP32-S3 + SX1262) -> LoRaWAN OTAA
; verso un gateway RAK (che fa da semplice packet forwarder verso un Network Server
; tipo ChirpStack / The Things Stack: vedi note nel README).

[env:heltec_wifi_lora_32_V4]
platform = espressif32
board = heltec_wifi_lora_32_V4
framework = arduino

; La board V4 non è (ancora) inclusa "di serie" nel platform espressif32 di PlatformIO,
; quindi si fornisce una definizione custom (boards/) + variant custom (variants/heltec_V4/).
board_build.variants_dir = variants
board_build.variant = heltec_V4

monitor_speed = 115200
monitor_dtr = 0
monitor_rts = 0
monitor_filters = esp32_exception_decoder

lib_deps =
    jgromes/RadioLib@^7.1.2

build_flags =
    -DCORE_DEBUG_LEVEL=3